services:
  catalog_db_postgres:
    image: "postgres:14.0"
    ports:
      - "5433:5432"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: void
      POSTGRES_PASSWORD: void
      POSTGRES_DB: db_catalog_service
    volumes:
      - ./db-data-catalog-service:/var/lib/postgresql/data

  order_db_postgres:
    image: "postgres:14.0"
    ports:
      - "5434:5432"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: void
      POSTGRES_PASSWORD: void
      POSTGRES_DB: db_order_service
    volumes:
      - ./db-data-order-service:/var/lib/postgresql/data
